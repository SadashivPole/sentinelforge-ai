name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      SENTINELFORGE_AI_PROVIDER: mock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov mypy ruff

      - name: Run pytest suite
        run: |
          python -m pytest tests/ --cov=sentinelforge --cov-report=xml -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff lint check
        run: ruff check sentinelforge/ tests/

      - name: Run ruff format check
        run: ruff format --check sentinelforge/ tests/

      - name: Run mypy type check
        run: mypy sentinelforge/

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run dependency vulnerability scan
        run: safety check --file requirements.txt

      - name: Run bandit SAST scan
        run: bandit -r sentinelforge/

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelforge-wheel
          path: dist/*.whl

  clean-install-smoke-test:
    name: Clean-install smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build wheel
        run: python -m build --wheel

      - name: Create fresh venv and install wheel
        run: |
          python -m venv /tmp/sf-smoke-venv
          /tmp/sf-smoke-venv/bin/pip install --upgrade pip
          /tmp/sf-smoke-venv/bin/pip install dist/sentinelforge-0.1.0-py3-none-any.whl

      - name: Verify CLI entry point
        run: /tmp/sf-smoke-venv/bin/sentinelforge --help

  dashboard-smoke-test:
    name: Dashboard smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start dashboard on localhost
        run: |
          nohup python -m sentinelforge.dashboard.server --host 127.0.0.1 --port 8080 > /tmp/dashboard.log 2>&1 &
          echo $! > /tmp/dashboard.pid
          sleep 3

      - name: Verify dashboard responds
        run: |
          curl -sf http://127.0.0.1:8080/overview > /tmp/dashboard-output.html
          test -s /tmp/dashboard-output.html
          grep -q "SOC Overview" /tmp/dashboard-output.html

      - name: Stop dashboard
        run: |
          kill $(cat /tmp/dashboard.pid) 2>/dev/null || true
          wait $(cat /tmp/dashboard.pid) 2>/dev/null || true

  website-build:
    name: Website build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website files exist
        run: |
          for f in public/index.html public/overview.html public/features.html public/architecture.html public/detection.html public/soc-workflows.html public/demo.html public/docs.html public/installation.html public/security.html public/roadmap.html public/about.html public/demo/index.html public/css/main.css public/js/nav.js public/img/favicon.svg; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
            test -s "$f" || { echo "Empty: $f"; exit 1; }
          done
          echo "All website files present and non-empty"
