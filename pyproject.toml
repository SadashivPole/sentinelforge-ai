[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelforge"
version = "0.1.0"
description = "SentinelForge AI — SOC log analysis and detection prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sentinelforge = "sentinelforge.cli.main:main"
sentinelforge-dashboard = "sentinelforge.dashboard.server:main"
sentinelforge-mcp = "sentinelforge.analyst.mcp_server:main"

[project.optional-dependencies]
analyst-mcp = ["mcp==2.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["sentinelforge", "sentinelforge.analyst", "sentinelforge.dashboard"]
