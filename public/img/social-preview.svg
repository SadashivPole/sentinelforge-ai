    <path d="M42 42 L42 86 L66 86 L66 42" stroke="#F1B64A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 64 L88 64 L94 52 L94 76" stroke="#F1B64A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="64" r="6" fill="#35D6C3"/>
    <circle cx="64" cy="64" r="2.5" fill="#FFFFFF"/>
