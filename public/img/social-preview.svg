  <!-- Wordmark -->
  <text x="650" y="315" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="700" fill="#E8F0FA" letter-spacing="-1px">Sentinel</text>
  <text x="995" y="315" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="700" fill="#35D6C3" letter-spacing="-1px">Forge</text>
  
