<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon fill="#35D6C3" points="0 0, 10 3.5, 0 7" />
    </marker>
    <style>
      .bg-public { fill: rgba(53, 214, 195, 0.08); stroke: rgba(53, 214, 195, 0.3); stroke-width: 2; }
      .bg-local { fill: rgba(241, 182, 74, 0.08); stroke: rgba(241, 182, 74, 0.3); stroke-width: 2; }
      .box { fill: #17263C; stroke: #35D6C3; stroke-width: 2; rx: 8; }
      .box-local { fill: #17263C; stroke: #F1B64A; stroke-width: 2; rx: 8; }
      .box-export { fill: #17263C; stroke: #EF6472; stroke-width: 2; rx: 8; }
      .title { fill: #35D6C3; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; }
      .subtitle { fill: #F1B64A; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; }
      .label { fill: #E8F0FA; font-family: system-ui, sans-serif; font-size: 13px; }
      .label-small { fill: #9FB0C4; font-family: system-ui, sans-serif; font-size: 11px; }
      .arrow { stroke: #9FB0C4; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-local { stroke: #F1B64A; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-export { stroke: #EF6472; stroke-width: 2; marker-end: url(#arrowhead); fill: none; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <!-- Public static website boundary -->
  <rect x="40" y="40" width="420" height="440" class="bg-public" rx="12" />
  <text x="70" y="70" class="title">Public website (GitHub Pages)</text>
  <text x="70" y="92" class="label-small">static HTML/CSS/JS — public/ — publicly accessible</text>

  <rect x="70" y="120" width="140" height="90" class="box" />
  <text x="140" y="150" class="label" text-anchor="middle">Home</text>
  <text x="140" y="170" class="label-small">index.html</text>

  <rect x="230" y="120" width="140" height="90" class="box" />
  <text x="300" y="150" class="label" text-anchor="middle">Detection</text>
  <text x="300" y="170" class="label-small">detection-showcase.html</text>

  <rect x="70" y="230" width="140" height="90" class="box" />
  <text x="140" y="260" class="label" text-anchor="middle">Demo</text>
  <text x="140" y="280" class="label-small">demo/index.html</text>

  <rect x="230" y="230" width="140" height="90" class="box" />
  <text x="300" y="260" class="label" text-anchor="middle">Architecture</text>
  <text x="300" y="280" class="label-small">architecture.html</text>

  <!-- Public interactive demo boundary -->
  <rect x="40" y="350" width="420" height="120" class="bg-public" rx="12" />
  <text x="70" y="380" class="title">Public interactive demo</text>
  <text x="70" y="402" class="label-small">demo/index.html — synthetic data only, precomputed results</text>

  <rect x="70" y="420" width="160" height="40" class="box" />
  <text x="150" y="444" class="label" text-anchor="middle">scenarios.json</text>
  <text x="150" y="458" class="label-small">5 scenarios · precomputed</text>

  <rect x="250" y="420" width="160" height="40" class="box" />
  <text x="330" y="444" class="label" text-anchor="middle">detection-showcase.json</text>
  <text x="330" y="458" class="label-small">real Python results</text>

  <!-- Sanitized JSON export bridge -->
  <rect x="200" y="320" width="120" height="60" class="box-export" />
  <text x="260" y="346" class="label" text-anchor="middle">Sanitized static</text>
  <text x="260" y="362" class="label" text-anchor="middle">JSON export</text>
  <text x="260" y="374" class="label-small" text-anchor="middle">precomputed only</text>

  <!-- Local dashboard boundary -->
  <rect x="500" y="40" width="460" height="440" class="bg-local" rx="12" />
  <text x="530" y="70" class="subtitle">Local SOC dashboard</text>
  <text x="530" y="92" class="label-small">Python HTTP server — 127.0.0.1:8080 — private, not public</text>

  <rect x="530" y="120" width="150" height="80" class="box-local" />
  <text x="605" y="145" class="label" text-anchor="middle">/overview</text>
  <text x="605" y="165" class="label-small">counts &amp; stats</text>

  <rect x="700" y="120" width="150" height="80" class="box-local" />
  <text x="775" y="145" class="label" text-anchor="middle">/alerts</text>
  <text x="775" y="165" class="label-small">detection alerts</text>

  <rect x="530" y="220" width="150" height="80" class="box-local" />
  <text x="605" y="245" class="label" text-anchor="middle">/events</text>
  <text x="605" y="265" class="label-small">event list</text>

  <rect x="700" y="220" width="150" height="80" class="box-local" />
  <text x="775" y="245" class="label" text-anchor="middle">/rules</text>
  <text x="775" y="265" class="label-small">rule catalog</text>

  <rect x="615" y="320" width="170" height="80" class="box-local" />
  <text x="700" y="345" class="label" text-anchor="middle">/attacks</text>
  <text x="700" y="365" class="label-small">MITRE coverage</text>

  <!-- Shared detection engine -->
  <rect x="40" y="500" width="920" height="60" class="box" rx="12" />
  <text x="500" y="532" class="title" text-anchor="middle">Common Python detection engine (sentinelforge/)</text>
  <text x="500" y="554" class="label-small" text-anchor="middle">CLI · ingestion · normalization · detection rules · evidence correlation · risk scoring · SQLite storage</text>

  <!-- Arrows: JSON export path (engine -> public) -->
  <line x1="500" y1="500" x2="500" y2="380" class="arrow-export" />
  <line x1="500" y1="380" x2="260" y2="380" class="arrow-export" />

  <!-- Arrows: local dashboard -> shared engine -->
  <line x1="605" y1="200" x2="605" y2="500" class="arrow-local" />
  <line x1="775" y1="200" x2="775" y2="500" class="arrow-local" />
  <line x1="605" y1="300" x2="605" y2="500" class="arrow-local" />
  <line x1="775" y1="300" x2="775" y2="500" class="arrow-local" />
  <line x1="700" y1="400" x2="700" y2="500" class="arrow-local" />

  <!-- SQLite storage -->
  <rect x="780" y="320" width="160" height="80" class="box-local" />
  <text x="860" y="345" class="label" text-anchor="middle">SQLite DB</text>
  <text x="860" y="365" class="label-small">local file only</text>
  <line x1="860" y1="400" x2="860" y2="500" class="arrow-local" />

</svg>
