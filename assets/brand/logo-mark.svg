<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- SentinelForge Logo Mark -->
  <!-- Abstract sentinel sweep with central evidence node and telemetry path -->
  
  <!-- Outer open arc (sentinel sweep boundary) -->
  <path d="M20 64 A 44 44 0 0 1 108 64" stroke="#17263C" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Inner signal arc (active scan) -->
  <path d="M34 64 A 30 30 0 0 1 94 64" stroke="#35D6C3" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Telemetry path forming abstract S/F monogram -->
  <path d="M42 42 L42 86 L66 86 L66 42" stroke="#F1B64A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66 64 L88 64 L94 52 L94 76" stroke="#F1B64A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central evidence node -->
  <circle cx="64" cy="64" r="6" fill="#35D6C3"/>
  <circle cx="64" cy="64" r="2.5" fill="#FFFFFF"/>
  
  <!-- Pulse rings -->
  <circle cx="64" cy="64" r="10" fill="none" stroke="#35D6C3" stroke-width="1.5" opacity="0.5"/>
  <circle cx="64" cy="64" r="16" fill="none" stroke="#35D6C3" stroke-width="1" opacity="0.3"/>
</svg>